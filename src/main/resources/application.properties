# ===========================================
# AI System Designer - Application Properties
# ===========================================

# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=ai-system-designer

# ===========================================
# LLM Configuration
# IMPORTANT: Set LLM_API_KEY via environment variable
# ===========================================
llm.provider=${LLM_PROVIDER:openrouter}
llm.api-key=${LLM_API_KEY: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}
llm.url=${LLM_URL:https://openrouter.ai/api/v1/chat/completions}
llm.model=${LLM_MODEL:openai/gpt-3.5-turbo}
llm.timeout-ms=${LLM_TIMEOUT_MS:20000}
llm.max-tokens=${LLM_MAX_TOKENS:4096}
llm.temperature=${LLM_TEMPERATURE:0.7}
llm.max-retries=${LLM_MAX_RETRIES:3}
llm.include-prompt-in-response=${LLM_INCLUDE_PROMPT:false}

# ===========================================
# H2 Database Configuration (File Mode)
# ===========================================
spring.datasource.url=jdbc:h2:file:./data/designs;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===========================================
# Security Configuration
# ===========================================
app.admin.key=${APP_ADMIN_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===========================================
# Rate Limiting
# ===========================================
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:10}
app.rate-limit.burst-capacity=${RATE_LIMIT_BURST:15}

# ===========================================
# Scheduler Configuration
# ===========================================
app.scheduler.purge.enabled=${SCHEDULER_PURGE_ENABLED:false}
app.scheduler.purge.retention-days=${SCHEDULER_PURGE_RETENTION_DAYS:30}
app.scheduler.purge.cron=${SCHEDULER_PURGE_CRON:0 0 2 * * ?}

# ===========================================
# Resilience4j Circuit Breaker
# ===========================================
resilience4j.circuitbreaker.instances.llmClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.llmClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llmClient.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llmClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.llmClient.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.llmClient.slow-call-duration-threshold=10s

# ===========================================
# Actuator / Monitoring
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=AI System Designer
info.app.description=AI-powered system architecture design generator
info.app.version=1.0.0

# ===========================================
# Logging
# ===========================================
logging.level.root=INFO
logging.level.com.cloudmonitor.ai=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================================
# Jackson JSON Configuration
# ===========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
