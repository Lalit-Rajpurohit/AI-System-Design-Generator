version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-system-designer
    ports:
      - "8080:8080"
    volumes:
      # Persist H2 database
      - ./data:/app/data
    environment:
      # Server
      - SERVER_PORT=8080

      # LLM Configuration (REQUIRED)
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_URL=${LLM_URL:-https://openrouter.ai/api/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-mistralai/mistral-7b-instruct}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-20000}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}

      # Security
      - APP_ADMIN_KEY=${APP_ADMIN_KEY:-change-me-in-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Rate Limiting
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-10}

      # Scheduler
      - SCHEDULER_PURGE_ENABLED=${SCHEDULER_PURGE_ENABLED:-false}
      - SCHEDULER_PURGE_RETENTION_DAYS=${SCHEDULER_PURGE_RETENTION_DAYS:-30}

      # Development options
      - H2_CONSOLE_ENABLED=${H2_CONSOLE_ENABLED:-false}
      - JPA_SHOW_SQL=${JPA_SHOW_SQL:-false}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # Optional: Frontend development server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-system-designer-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api/v1
    depends_on:
      - app
    networks:
      - app-network
    profiles:
      - frontend

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
